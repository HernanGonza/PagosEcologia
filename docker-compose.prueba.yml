# MODO PRUEBA (hasta que exista la pasarela de pagos). Se suma al compose principal:
#   docker compose -f docker-compose.yml -f docker-compose.prueba.yml up -d --build
#
# Qué cambia: la API NO corre con NODE_ENV=production, así que no aplica las guardas de producción
#   - PAYMENT_PROVIDER=mock (en producción exige macroclick)
#   - EMISION_SIMULADA=1: POST /api/<modulo>/dev/emitir/<numero> emite el certificado de una solicitud aprobada sin pago
#   - CORS abierto
# Por eso: solo para pruebas internas y sin datos reales. Cualquiera que llegue al server puede emitir certificados.
# Para pasar a real: levantar solo con docker-compose.yml, PAYMENT_PROVIDER=macroclick y sin EMISION_SIMULADA.
services:
  api:
    environment:
      NODE_ENV: staging
      PAYMENT_PROVIDER: mock
      EMISION_SIMULADA: "1"
