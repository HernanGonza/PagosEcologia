# Despliegue en el dominio de ecodatos, bajo /pagos/ (ver docs/despliegue-docker.md):
#   docker compose up -d --build
# Con el .env del servidor trae COMPOSE_FILE=docker-compose.yml:docker-compose.prueba.yml:docker-compose.ecodatos.yml
# (mismo mecanismo que la wiki). Este archivo solo no publica ningún puerto: la entrada es el nginx de ecodatos.
# La base y el Storage son los de Ecodatos (Supabase self-hosted): el servidor tiene que llegar a DATABASE_URL.
name: pagos-ecodatos

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # Cadena de proxies delante de la API: HAProxy -> nginx de ecodatos -> nginx de pagos. Verificar en el server.
      TRUST_PROXY: ${TRUST_PROXY:-3}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
