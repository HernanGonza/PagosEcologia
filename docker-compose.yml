# Producción sobre la IP del servidor (sin dominio): todo entra por el puerto 80.
#   docker compose up -d --build
# La base y el Storage son los de Ecodatos (Supabase self-hosted): el servidor tiene que llegar a DATABASE_URL.
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      TRUST_PROXY: "1"      # hay un solo proxy delante: el nginx de abajo
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      target: web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
