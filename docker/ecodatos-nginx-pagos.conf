        # ── Pagos y trámites ── (pegar dentro del server { } de ecodatos/infra/nginx/nginx.conf, junto a /wiki/ y /claves/)
        # Un solo bloque: pasa todo /pagos/ al contenedor pagos-web SIN sacar el prefijo (él sirve /pagos/publico/,
        # /pagos/tecnicos/, /pagos/recaudaciones/, /pagos/administracion/, /pagos/mail/ y /pagos/api/).
        location = /pagos { return 301 /pagos/publico/; }

        location ^~ /pagos/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $pagos http://pagos-web:80;
            proxy_pass $pagos;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 26m;   # documentos que se suben por /pagos/api/
            proxy_read_timeout 60s;
        }
