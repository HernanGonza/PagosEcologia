# nginx del contenedor "pagos-web". Todo cuelga de /pagos/ porque delante está el nginx de ecodatos, que
# pasa /pagos/ a este contenedor SIN cambiar la ruta (ver docker/ecodatos-nginx-pagos.conf):
#   /pagos/publico/         botonera pública (sin cuenta)
#   /pagos/tecnicos/        paneles de área
#   /pagos/recaudaciones/   Dirección de Recaudaciones
#   /pagos/administracion/  administración del sistema
#   /pagos/mail/            bandeja de mails de prueba
#   /pagos/api/             la API (contenedor "api"): /pagos/api/x -> api:3001/api/x
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los documentos se suben por la API (fotos/PDF): holgura sobre el límite real.
    client_max_body_size 25m;
    server_tokens off;
    include /etc/nginx/snippets/seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    location = /pagos  { return 302 /pagos/publico/; }
    location = /pagos/ { return 302 /pagos/publico/; }

    location /pagos/api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        # Cadena: HAProxy -> nginx de ecodatos -> este nginx -> API (TRUST_PROXY=3 cuenta estos 3 saltos).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Archivos con hash: se pueden cachear para siempre.
    location ~ ^/pagos/(publico|recaudaciones|tecnicos|administracion)/assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /pagos/mail { return 301 /pagos/mail/; }
    location /pagos/mail/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store";
        try_files $uri /pagos/mail/index.html;
    }

    # Cada front es una SPA: lo que no es archivo vuelve a su index.html.
    location /pagos/publico/        { include /etc/nginx/snippets/seguridad.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ /pagos/publico/index.html; }
    location /pagos/recaudaciones/  { include /etc/nginx/snippets/seguridad.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ /pagos/recaudaciones/index.html; }
    location /pagos/tecnicos/       { include /etc/nginx/snippets/seguridad.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ /pagos/tecnicos/index.html; }
    location /pagos/administracion/ { include /etc/nginx/snippets/seguridad.conf; add_header Cache-Control "no-cache"; try_files $uri $uri/ /pagos/administracion/index.html; }

    location / { return 404; }
}
