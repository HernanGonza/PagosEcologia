# Un solo punto de entrada (puerto 80). Sin dominio: todo cuelga de la IP del servidor.
#   /           botonera pública      /admin/     Recaudaciones
#   /paneles/   paneles de área       /sistema/   administración técnica
#   /api/       la API (contenedor "api")
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Los documentos se suben por la API (fotos/PDF): holgura sobre el límite real.
    client_max_body_size 25m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_set_header Host $host;
        # La API cuenta 1 proxy (TRUST_PROXY=1): esta es la IP real del visitante.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash: se pueden cachear para siempre.
    location ~ ^/(admin/|paneles/|sistema/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cada front es una SPA: lo que no es archivo vuelve a su index.html.
    location /admin/   { try_files $uri $uri/ /admin/index.html; }
    location /paneles/ { try_files $uri $uri/ /paneles/index.html; }
    location /sistema/ { try_files $uri $uri/ /sistema/index.html; }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
